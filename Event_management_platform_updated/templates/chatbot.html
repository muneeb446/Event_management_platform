<!-- EventHub AI Assistant -->
<style>
#chatFab {
  position:fixed; bottom:28px; right:28px; z-index:9999;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg,#7c2fe8,#e040fb);
  border:none; cursor:pointer;
  box-shadow:0 8px 28px rgba(124,47,232,.6);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; transition:transform .25s,box-shadow .25s;
  animation:fabPop .5s cubic-bezier(.34,1.56,.64,1) both;
}
#chatFab:hover{transform:scale(1.12);box-shadow:0 12px 36px rgba(124,47,232,.8);}
@keyframes fabPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

#chatWindow {
  position:fixed; bottom:100px; right:28px; z-index:9998;
  width:370px; max-width:calc(100vw - 40px);
  height:520px; max-height:calc(100vh - 130px);
  background:#0d0520;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;
  display:flex; flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.8);
  overflow:hidden;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s;
  transform:translateY(20px) scale(.95);
  opacity:0; pointer-events:none;
}
#chatWindow.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all;}

.ch-header{
  background:linear-gradient(135deg,#7c2fe8,#e040fb);
  padding:16px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0;
}
.ch-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ch-header-text h4{font-size:15px;font-weight:700;color:#fff;margin:0;font-family:'Syne',sans-serif;}
.ch-header-text p{font-size:11px;color:rgba(255,255,255,.8);margin:0;}
.ch-close{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.ch-close:hover{background:rgba(255,255,255,.35);}

.ch-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;}
.ch-messages::-webkit-scrollbar{width:4px;}
.ch-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

.msg{display:flex;gap:8px;animation:msgIn .25s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}

.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;}
.msg.bot .msg-avatar{background:linear-gradient(135deg,#7c2fe8,#e040fb);}
.msg.user .msg-avatar{background:linear-gradient(135deg,#06b6d4,#3b82f6);}

.msg-bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.6;font-family:'DM Sans',sans-serif;word-break:break-word;}
.msg.bot .msg-bubble{background:rgba(255,255,255,.1);color:#ffffff;border-bottom-left-radius:4px;}
.msg.user .msg-bubble{background:linear-gradient(135deg,#7c2fe8,#e040fb);color:#ffffff;border-bottom-right-radius:4px;}

.typing-dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);margin:0 2px;animation:dot 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
.qr-btn{background:rgba(124,47,232,.25);border:1px solid rgba(124,47,232,.5);color:#d8b4fe;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.qr-btn:hover{background:rgba(124,47,232,.5);color:#fff;}

.ch-input-row{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:8px;flex-shrink:0;background:rgba(255,255,255,.04);}
#chatInput{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;color:#fff;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;resize:none;max-height:80px;transition:border .2s;}
#chatInput:focus{border-color:#7c2fe8;}
#chatInput::placeholder{color:rgba(255,255,255,.35);}
#chatSend{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c2fe8,#e040fb);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:.2s;align-self:flex-end;}
#chatSend:hover{transform:scale(1.08);}
#chatSend:disabled{opacity:.4;cursor:not-allowed;transform:none;}
</style>

<button id="chatFab" onclick="toggleChat()" title="Ask EventHub AI">🤖</button>

<div id="chatWindow">
  <div class="ch-header">
    <div class="ch-avatar">🤖</div>
    <div class="ch-header-text">
      <h4>EventHub Assistant</h4>
      <p>AI-powered help · Always online</p>
    </div>
    <button class="ch-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="ch-messages" id="chatMessages"></div>
  <div class="quick-replies" id="quickReplies">
    <button class="qr-btn" onclick="sendQuick('How do I register for an event?')">How to register?</button>
    <button class="qr-btn" onclick="sendQuick('How to download my ticket?')">Get ticket</button>
    <button class="qr-btn" onclick="sendQuick('How to reset my password?')">Reset password</button>
    <button class="qr-btn" onclick="sendQuick('What events are available?')">View events</button>
  </div>
  <div class="ch-input-row">
    <textarea id="chatInput" placeholder="Ask anything about EventHub…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
    <button id="chatSend" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
(function(){
  const SYSTEM = `You are the EventHub AI Assistant — a helpful, friendly chatbot for EventHub, a college event management platform.

You help students with:
- How to register for events: Go to Home page → click "Register Now" on any event card → fill the form → confirm payment
- How to download tickets: After registration, go to "My Registrations" or check the ticket page → click "Download Ticket PDF"
- How to download certificates: Same page → click "Download Certificate"  
- How to reset password: On login page → click "Forgot password?" link → enter email → use the reset link
- How to view my registrations: Click your name dropdown in navbar → "My Registrations"
- How to update profile: Click your name dropdown → "My Profile" → edit details
- How to give feedback: Navbar dropdown → "Feedback" → select event → give star rating + message
- Navigation: Home (all events), My Profile, My Registrations, Feedback, Gallery, Logout
- Admin login: admin@gmail.com / admin123 (only for administrators)

Keep answers short, clear and friendly. Use emojis occasionally. If unsure, suggest contacting the admin.`;

  let history = [];
  let isOpen  = false;
  let busy    = false;

  function greeting(){
    if(!history.length)
      appendMsg('bot','👋 Hi! I\'m your EventHub Assistant. Ask me anything about registering for events, downloading tickets, or using the platform!');
  }

  window.toggleChat = function(){
    isOpen = !isOpen;
    document.getElementById('chatWindow').classList.toggle('open', isOpen);
    if(isOpen){ greeting(); setTimeout(()=>document.getElementById('chatInput').focus(),300); }
  };

  window.sendQuick = function(text){
    document.getElementById('chatInput').value = text;
    document.getElementById('quickReplies').style.display = 'none';
    sendMessage();
  };

  window.sendMessage = async function(){
    const inp  = document.getElementById('chatInput');
    const text = inp.value.trim();
    if(!text || busy) return;
    inp.value = ''; inp.style.height = 'auto';
    document.getElementById('quickReplies').style.display = 'none';

    appendMsg('user', text);
    history.push({role:'user', content:text});

    busy = true;
    document.getElementById('chatSend').disabled = true;
    const tid = appendTyping();

    try {
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({system: SYSTEM, messages: history})
      });

      removeTyping(tid);

      if(!res.ok){
        // Fallback: answer common questions locally if API not configured
        const reply = localAnswer(text);
        appendMsg('bot', reply);
        history.push({role:'assistant', content:reply});
      } else {
        const data  = await res.json();
        const reply = data.reply || 'Sorry, I could not get a response.';
        appendMsg('bot', reply);
        history.push({role:'assistant', content:reply});
      }
    } catch(e){
      removeTyping(tid);
      const reply = localAnswer(text);
      appendMsg('bot', reply);
      history.push({role:'assistant', content:reply});
    }

    if(history.length > 20) history = history.slice(-20);
    busy = false;
    document.getElementById('chatSend').disabled = false;
    document.getElementById('chatInput').focus();
  };

  // Local fallback answers when API not configured
  function localAnswer(q){
    q = q.toLowerCase();
    if(q.includes('register') || q.includes('sign up') || q.includes('join'))
      return '🎟 To register for an event:\n1. Go to the Home page\n2. Click "Register Now" on any event card\n3. Fill in your details\n4. Confirm on the payment page\nYou\'ll get a ticket with QR code instantly!';
    if(q.includes('ticket') || q.includes('download'))
      return '📄 To download your ticket:\n1. Click your name in the top navbar\n2. Go to "My Registrations"\n3. Click "🎫 Ticket" to download PDF\n4. Or click "📜 Certificate" for your certificate!';
    if(q.includes('password') || q.includes('forgot') || q.includes('reset'))
      return '🔑 To reset your password:\n1. Go to the Login page\n2. Click "Forgot password?" link\n3. Enter your email address\n4. Use the reset link provided\nYou can set a new password instantly!';
    if(q.includes('profile') || q.includes('edit') || q.includes('update'))
      return '👤 To update your profile:\n1. Click your name in the top navbar\n2. Select "My Profile"\n3. Edit your name, phone, college, degree\n4. Click "Save Changes"';
    if(q.includes('feedback') || q.includes('review') || q.includes('rating'))
      return '💬 To give feedback:\n1. Click your name dropdown\n2. Select "Feedback"\n3. Choose an event\n4. Click star rating\n5. Write your review and submit!';
    if(q.includes('event') || q.includes('available') || q.includes('what'))
      return '📅 To see all events, go to the Home page. You can filter by category (Workshop, Technical, Cultural, Sports) or search by name. Each card shows date, time, location and entry fee!';
    if(q.includes('admin'))
      return '👑 Admin login:\nEmail: admin@gmail.com\nPassword: admin123\nAdmins can add/edit events, view all registrations, manage users and upload gallery photos.';
    if(q.includes('gallery'))
      return '🖼 The Gallery shows photos from past events! Click "Gallery" in the navbar. You can filter by event and click any photo to view it full screen.';
    if(q.includes('logout') || q.includes('log out') || q.includes('sign out'))
      return '🚪 To logout, click your name in the top right navbar and select "Logout". Your session will be cleared safely.';
    if(q.includes('hello') || q.includes('hi') || q.includes('hey'))
      return '👋 Hello! I\'m EventHub Assistant. I can help you register for events, download tickets & certificates, navigate the platform, and more. What do you need help with?';
    return '🤔 I\'m here to help with EventHub! You can ask me about:\n• Registering for events\n• Downloading tickets & certificates\n• Resetting your password\n• Updating your profile\n• Giving feedback\n\nWhat would you like to know?';
  }

  function appendMsg(role, text){
    const box  = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const av = role==='bot'
      ? '<div class="msg-avatar">🤖</div>'
      : '<div class="msg-avatar">👤</div>';
    wrap.innerHTML = `${role==='bot'?av:''}
      <div class="msg-bubble">${esc(text)}</div>
      ${role==='user'?av:''}`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  function appendTyping(){
    const box  = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    const id   = 'typing_'+Date.now();
    wrap.id = id; wrap.className = 'msg bot';
    wrap.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble typing-dots"><span></span><span></span><span></span></div>`;
    box.appendChild(wrap); box.scrollTop = box.scrollHeight;
    return id;
  }

  function removeTyping(id){ const el=document.getElementById(id); if(el) el.remove(); }

  function esc(t){
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }
})();
</script>
