<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — {{ event['title'] }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
<style>
body{background:#071739;color:white;font-family:'DM Sans',sans-serif;}
.navbar-brand{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.navbar-brand span{color:#e040fb;}
.card-dark{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;}
.form-control,.form-select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;border-radius:10px;}
.form-control:focus,.form-select:focus{background:rgba(124,47,232,.15);border-color:#7c2fe8;color:white;box-shadow:none;}
.form-label{font-size:12px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.7px;}
.btn-register{background:linear-gradient(135deg,#7c2fe8,#e040fb);border:none;color:white;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;font-family:'Syne',sans-serif;transition:.2s;}
.btn-register:hover{opacity:.9;transform:translateY(-2px);}
.event-info{background:rgba(124,47,232,.15);border:1px solid rgba(124,47,232,.3);border-radius:16px;padding:20px;}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 py-3">
  <a class="navbar-brand" href="/">Event<span>Hub</span></a>
  <a href="/" class="btn btn-outline-light btn-sm">← Back</a>
</nav>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="event-info mb-4">
        <h5 style="font-family:'Syne',sans-serif;font-weight:700;">{{ event['title'] }}</h5>
        <p style="color:rgba(255,255,255,.6);font-size:14px;margin-bottom:0;">📅 {{ event['date'] }} &nbsp;|&nbsp; 🕒 {{ event['time'] }} &nbsp;|&nbsp; 📍 {{ event['location'] }}</p>
      </div>
      <div class="card-dark">
        <h4 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:24px;">📝 Registration Form</h4>
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" value="{{ user.name if user else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Age</label>
              <input type="number" name="age" class="form-control" min="10" max="60" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ user.phone if user and user.phone else '' }}" placeholder="Your phone number">
            </div>
            <div class="col-md-6">
              <label class="form-label">College</label>
              <input type="text" name="college" class="form-control" value="{{ user.college if user and user.college else '' }}" required>
            </div>
            <div class="col-12">
              <label class="form-label">Degree / Course</label>
              <input type="text" name="degree" class="form-control" value="{{ user.degree if user and user.degree else '' }}" placeholder="e.g. BCA 3rd Year" required>
            </div>
          </div>
          <button type="submit" class="btn-register mt-4">Continue to Payment →</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% include 'chatbot.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
