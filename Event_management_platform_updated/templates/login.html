<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventHub — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --purple: #7c2fe8;
  --pink:   #e040fb;
  --ink:    #0a0118;
}

/* ── BODY ── */
body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── FULL-PAGE SLIDESHOW ── */
.bg-slide {
  position: fixed; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0;
  transition: opacity 1.4s ease;
  z-index: 0;
}
.bg-slide::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(10,1,24,0.82) 0%, rgba(124,47,232,0.4) 100%);
}
.bg-slide.active { opacity: 1; }

/* ── PARTICLES ── */
.particles {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; border-radius: 50%;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(110%) scale(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.5; }
  100% { transform: translateY(-10%) scale(1.3); opacity: 0; }
}

/* ── SLIDE DOTS ── */
.slide-dots {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 5;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  cursor: pointer; transition: all 0.3s;
  border: none;
}
.dot.active { width: 26px; border-radius: 4px; background: var(--pink); }

/* ── CARD ── */
.card {
  position: relative; z-index: 10;
  width: 460px; max-width: 95vw;
  background: rgba(13, 5, 32, 0.9);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px;
  padding: 44px 42px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.65);
  max-height: 96vh;
  overflow-y: auto;
  animation: cardIn 0.5s cubic-bezier(.34,1.56,.64,1) both 0.1s;
}
.card::-webkit-scrollbar { width: 0; }

@keyframes cardIn {
  from { opacity:0; transform: translateY(24px) scale(0.95); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

/* logo */
.logo {
  font-family: 'Syne', sans-serif;
  font-size: 26px; font-weight: 800;
  color: #fff; margin-bottom: 4px;
}
.logo span { color: var(--pink); }
.subtitle { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 30px; }

/* tabs */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 4px;
  margin-bottom: 26px; gap: 4px;
}
.tab {
  flex: 1; padding: 10px;
  border: none; background: transparent;
  color: rgba(255,255,255,0.4);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  border-radius: 9px; cursor: pointer;
  transition: all 0.22s;
}
.tab.active {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 4px 14px rgba(124,47,232,0.45);
}

/* form panels */
.pane { display: none; animation: paneIn 0.3s ease; }
.pane.active { display: block; }
@keyframes paneIn {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

/* fields */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 6px; letter-spacing: 0.8px;
  text-transform: uppercase;
}
.field input {
  width: 100%; padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 11px; color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; outline: none;
  transition: all 0.2s;
}
.field input:focus {
  border-color: var(--purple);
  background: rgba(124,47,232,0.1);
  box-shadow: 0 0 0 3px rgba(124,47,232,0.15);
}
.field input::placeholder { color: rgba(255,255,255,0.2); }

/* password wrapper */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 46px; }
.eye-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  font-size: 17px; line-height: 1;
  color: rgba(255,255,255,0.35);
  transition: color 0.2s; padding: 0;
}
.eye-btn:hover { color: rgba(255,255,255,0.8); }

/* strength bar */
.strength-bar { display: flex; gap: 4px; margin-top: 6px; }
.seg { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,0.1); transition:background 0.3s; }

/* remember + forgot row */
.row-between {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.check-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; color: rgba(255,255,255,0.5); cursor: pointer;
}
.check-label input[type=checkbox] { width:15px; height:15px; accent-color: var(--purple); }
.link-pink {
  font-size: 13px; color: var(--pink);
  text-decoration: none; transition: opacity 0.2s;
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: 'DM Sans', sans-serif;
}
.link-pink:hover { opacity: 0.7; }

/* primary button */
.btn-main {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border: none; border-radius: 12px;
  color: #fff; font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.4px;
  transition: all 0.22s;
  box-shadow: 0 6px 22px rgba(124,47,232,0.35);
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,47,232,0.5); }
.btn-main:active { transform: translateY(0); }

/* alerts */
.alert-err {
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 10px; padding: 11px 15px;
  color: #fca5a5; font-size: 13px; margin-bottom: 16px;
}
.alert-ok {
  background: rgba(16,185,129,0.12);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 10px; padding: 11px 15px;
  color: #6ee7b7; font-size: 13px; margin-bottom: 16px;
}

/* ── FORGOT MODAL ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 9999;
  display: none; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: #130730;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px; padding: 38px;
  width: 400px; max-width: 92vw;
  position: relative;
  animation: cardIn 0.25s ease;
}
.modal h3 { font-family:'Syne',sans-serif; font-size:20px; color:#fff; margin-bottom:6px; }
.modal p  { font-size:13px; color:rgba(255,255,255,0.45); margin-bottom:22px; }
.modal-x {
  position:absolute; top:14px; right:16px;
  background:none; border:none; color:rgba(255,255,255,0.35);
  font-size:20px; cursor:pointer; line-height:1;
  transition: color 0.2s;
}
.modal-x:hover { color:#fff; }

@media(max-width:520px){
  .card { padding: 34px 26px; }
}
</style>
</head>
<body>

<!-- Slideshow background -->
<div class="bg-slide active" id="s0" style="background-image:url('https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=1400&auto=format&fit=crop')"></div>
<div class="bg-slide"        id="s1" style="background-image:url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=1400&auto=format&fit=crop')"></div>
<div class="bg-slide"        id="s2" style="background-image:url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1400&auto=format&fit=crop')"></div>
<div class="bg-slide"        id="s3" style="background-image:url('https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1400&auto=format&fit=crop')"></div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Slide dots -->
<div class="slide-dots" id="dots"></div>

<!-- Center card -->
<div class="card">
  <div class="logo">Event<span>Hub</span></div>
  <div class="subtitle">College Event Management Platform</div>

  {% if error %}
  <div class="alert-err">⚠ {{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="alert-ok">✓ {{ success }}</div>
  {% endif %}

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login', this)">Sign In</button>
    <button class="tab"        onclick="switchTab('register', this)">Create Account</button>
  </div>

  <!-- ── LOGIN ── -->
  <div class="pane active" id="pane-login">
    <form method="POST" action="/login">
      <div class="field">
        <label>Email or Username</label>
        <input type="text" name="email" placeholder="Email or your username" required
               value="{{ remembered_email or '' }}" autocomplete="username">
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="lPw" placeholder="••••••••" required>
          <button type="button" class="eye-btn" onclick="toggleEye('lPw',this)" tabindex="-1">👁</button>
        </div>
      </div>

      <div class="row-between">
        <label class="check-label">
          <input type="checkbox" name="remember_me" {% if remembered_email %}checked{% endif %}>
          Remember me
        </label>
        <button type="button" class="link-pink" onclick="openForgot()">Forgot password?</button>
      </div>

      <button type="submit" class="btn-main">Sign In →</button>
    </form>
  </div>

  <!-- ── REGISTER ── -->
  <div class="pane" id="pane-register">
    <form method="POST" action="/register" onsubmit="return checkReg()">
      <div class="field">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="rPw" placeholder="Min. 6 characters"
                 required oninput="strengthCheck(this.value)">
          <button type="button" class="eye-btn" onclick="toggleEye('rPw',this)" tabindex="-1">👁</button>
        </div>
        <div class="strength-bar">
          <div class="seg" id="sg1"></div><div class="seg" id="sg2"></div>
          <div class="seg" id="sg3"></div><div class="seg" id="sg4"></div>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" name="confirm_password" id="rCp" placeholder="Repeat password" required>
          <button type="button" class="eye-btn" onclick="toggleEye('rCp',this)" tabindex="-1">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-main">Create Account →</button>
    </form>
  </div>
</div><!-- /card -->

<!-- ── FORGOT PASSWORD MODAL ── -->
<div class="overlay" id="forgotOverlay" onclick="bgClose(event)">
  <div class="modal">
    <button class="modal-x" onclick="closeForgot()">✕</button>
    <h3>Reset Password</h3>
    <p>Enter your email and we'll generate a reset link for you.</p>
    <form method="POST" action="/forgot_password">
      <div class="field">
        <label>Email Address</label>
        <input type="email" name="forgot_email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn-main">Send Reset Link →</button>
    </form>
  </div>
</div>

<script>
/* ── SLIDESHOW ── */
const TOTAL = 4;
let cur = 0;
const dotsEl = document.getElementById('dots');

for(let i=0;i<TOTAL;i++){
  const b = document.createElement('button');
  b.className = 'dot' + (i===0?' active':'');
  b.onclick = ()=> goSlide(i);
  dotsEl.appendChild(b);
}

function goSlide(n){
  document.getElementById('s'+cur).classList.remove('active');
  dotsEl.children[cur].classList.remove('active');
  cur = n;
  document.getElementById('s'+cur).classList.add('active');
  dotsEl.children[cur].classList.add('active');
}
setInterval(()=> goSlide((cur+1)%TOTAL), 4500);

/* ── PARTICLES ── */
(function(){
  const el = document.getElementById('particles');
  const cols = ['#e040fb','#7c2fe8','#ffd166','#00c6ff','#a78bfa'];
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = Math.random()*10+4;
    Object.assign(p.style,{
      width: sz+'px', height: sz+'px',
      left: Math.random()*100+'%',
      background: cols[Math.floor(Math.random()*cols.length)],
      opacity: Math.random()*0.45+0.08,
      animationDuration: (Math.random()*12+8)+'s',
      animationDelay: (Math.random()*10)+'s',
    });
    el.appendChild(p);
  }
})();

/* ── TABS ── */
function switchTab(id, btn){
  document.querySelectorAll('.tab').forEach(t=> t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=> p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pane-'+id).classList.add('active');
}

/* ── EYE TOGGLE ── */
function toggleEye(id, btn){
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

/* ── PASSWORD STRENGTH ── */
function strengthCheck(pw){
  const cols = ['#ef4444','#f97316','#eab308','#22c55e'];
  let s = 0;
  if(pw.length >= 6)          s++;
  if(/[A-Z]/.test(pw))        s++;
  if(/[0-9]/.test(pw))        s++;
  if(/[^A-Za-z0-9]/.test(pw)) s++;
  for(let i=1;i<=4;i++){
    document.getElementById('sg'+i).style.background =
      i<=s ? cols[s-1] : 'rgba(255,255,255,0.1)';
  }
}

/* ── REGISTER VALIDATION ── */
function checkReg(){
  const pw = document.getElementById('rPw').value;
  const cp = document.getElementById('rCp').value;
  if(pw.length < 6){ alert('Password must be at least 6 characters.'); return false; }
  if(pw !== cp)    { alert('Passwords do not match!'); return false; }
  return true;
}

/* ── FORGOT MODAL ── */
function openForgot(){ document.getElementById('forgotOverlay').classList.add('open'); }
function closeForgot(){ document.getElementById('forgotOverlay').classList.remove('open'); }
function bgClose(e){ if(e.target===document.getElementById('forgotOverlay')) closeForgot(); }

/* ── Auto-open register tab from URL hash ── */
if(location.hash==='#register'){
  document.querySelectorAll('.tab')[1].click();
}
</script>
</body>
</html>
