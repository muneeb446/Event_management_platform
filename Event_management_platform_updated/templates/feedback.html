<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback — EventHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
<style>
body{background:#071739;color:white;font-family:'DM Sans',sans-serif;}
.navbar-brand{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.navbar-brand span{color:#e040fb;}
.card-dark{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px;}
.form-control,.form-select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;border-radius:10px;}
.form-control:focus,.form-select:focus{background:rgba(124,47,232,.15);border-color:#7c2fe8;color:white;box-shadow:none;}
.form-label{font-size:12px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.7px;}
.star-row{display:flex;gap:8px;margin-bottom:8px;}
.star-btn{font-size:28px;cursor:pointer;opacity:.4;transition:.2s;background:none;border:none;}
.star-btn.active,.star-btn:hover{opacity:1;}
.btn-submit{background:linear-gradient(135deg,#7c2fe8,#e040fb);border:none;color:white;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;font-family:'Syne',sans-serif;}
.btn-submit:hover{opacity:.9;}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 py-3">
  <a class="navbar-brand" href="/">Event<span>Hub</span></a>
  <a href="/" class="btn btn-outline-light btn-sm">← Home</a>
</nav>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card-dark">
        <h3 style="font-family:'Syne',sans-serif;font-weight:800;margin-bottom:6px;">💬 Share Your Feedback</h3>
        <p style="color:rgba(255,255,255,.4);margin-bottom:28px;">Your review helps improve future events.</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" name="name" class="form-control" value="{{ session.get('user','') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Event</label>
            <select name="event_id" class="form-select" required>
              <option value="">Select an event</option>
              {% for e in events %}<option value="{{ e.id }}">{{ e.title }}</option>{% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Rating</label>
            <div class="star-row" id="stars">
              {% for i in range(1,6) %}
              <button type="button" class="star-btn" onclick="setRating({{ i }})">⭐</button>
              {% endfor %}
            </div>
            <input type="hidden" name="rating" id="ratingInput" value="5">
          </div>
          <div class="mb-4">
            <label class="form-label">Your Review</label>
            <textarea name="message" class="form-control" rows="4" placeholder="Tell us about your experience..." required></textarea>
          </div>
          <button type="submit" class="btn-submit">Submit Feedback →</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% include 'chatbot.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentRating = 5;
document.querySelectorAll('.star-btn').forEach((b,i)=>b.classList.toggle('active',i<5));
function setRating(n){
  currentRating = n;
  document.getElementById('ratingInput').value = n;
  document.querySelectorAll('.star-btn').forEach((b,i)=>b.classList.toggle('active',i<n));
}
</script>
</body>
</html>
