<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — EventHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0118;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#130730;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 44px;width:420px;max-width:92vw;animation:pop .4s ease;}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:white;margin-bottom:24px;}
.logo span{color:#e040fb;}
h2{font-family:'Syne',sans-serif;font-size:22px;color:white;margin-bottom:6px;}
p{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:24px;}
label{display:block;font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.pw-wrap{position:relative;}
input{width:100%;padding:12px 46px 12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;color:white;font-size:15px;outline:none;font-family:'DM Sans',sans-serif;transition:border .2s;}
input:focus{border-color:#7c2fe8;box-shadow:0 0 0 3px rgba(124,47,232,.15);}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:rgba(255,255,255,.35);}
.mb{margin-bottom:18px;}
button[type=submit]{width:100%;padding:13px;background:linear-gradient(135deg,#7c2fe8,#e040fb);border:none;border-radius:12px;color:white;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s;}
button[type=submit]:hover{transform:translateY(-2px);}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:11px;color:#fca5a5;font-size:13px;margin-bottom:16px;}
a{color:#e040fb;text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Event<span>Hub</span></div>
  <h2>Set New Password</h2>
  <p>Choose a strong password for your account.</p>
  {% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
  <form method="POST">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="mb">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" name="password" id="pw1" placeholder="Min. 6 characters" required>
        <button type="button" class="eye-btn" onclick="toggleEye('pw1',this)">👁</button>
      </div>
    </div>
    <div class="mb">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" name="confirm" id="pw2" placeholder="Repeat password" required>
        <button type="button" class="eye-btn" onclick="toggleEye('pw2',this)">👁</button>
      </div>
    </div>
    <button type="submit">Update Password →</button>
  </form>
  <p style="text-align:center;margin-top:20px;"><a href="/login">← Back to Login</a></p>
</div>
<script>
function toggleEye(id,btn){
  const i=document.getElementById(id);
  i.type=i.type==='password'?'text':'password';
  btn.textContent=i.type==='text'?'🙈':'👁';
}
</script>
</body>
</html>
