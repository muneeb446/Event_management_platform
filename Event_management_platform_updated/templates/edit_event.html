<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Event — EventHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
<style>
body{background:#071739;color:white;font-family:'DM Sans',sans-serif;}
.navbar-brand{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.navbar-brand span{color:#e040fb;}
.card-dark{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;}
.form-control,.form-select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;border-radius:10px;}
.form-control:focus,.form-select:focus{background:rgba(124,47,232,.15);border-color:#7c2fe8;color:white;box-shadow:none;}
.form-label{font-size:12px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.7px;}
.btn-purple{background:linear-gradient(135deg,#7c2fe8,#e040fb);border:none;color:white;border-radius:10px;padding:12px 28px;font-weight:700;}
.btn-purple:hover{opacity:.9;color:white;}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 py-3">
  <a class="navbar-brand" href="/admin">Event<span>Hub</span></a>
  <a href="/admin" class="btn btn-outline-light btn-sm">← Admin Panel</a>
</nav>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-dark">
        <h4 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:24px;">✏️ Edit Event</h4>
        <form method="POST" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Title</label><input type="text" name="title" class="form-control" value="{{ event.title }}" required></div>
            <div class="col-md-6"><label class="form-label">Category</label>
              <select name="category" class="form-select">
                {% for cat in ['Workshop','Technical','Cultural','Sports','Seminar'] %}
                <option value="{{ cat }}" {% if event.category==cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4"><label class="form-label">Date</label><input type="text" name="date" class="form-control" value="{{ event.date }}" required></div>
            <div class="col-md-4"><label class="form-label">Time</label><input type="text" name="time" class="form-control" value="{{ event.time }}" required></div>
            <div class="col-md-4"><label class="form-label">Location</label><input type="text" name="location" class="form-control" value="{{ event.location }}" required></div>
            <div class="col-md-4"><label class="form-label">Fee (₹)</label><input type="number" name="fee" class="form-control" value="{{ event.fee or 0 }}"></div>
            <div class="col-md-4"><label class="form-label">Seats</label><input type="number" name="seats" class="form-control" value="{{ event.seats or 100 }}"></div>
            <div class="col-md-4"><label class="form-label">New Image</label><input type="file" name="image" class="form-control" accept="image/*"></div>
            <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ event.description or '' }}</textarea></div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn-purple">💾 Save Changes</button>
              <a href="/admin" class="btn btn-outline-light">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
